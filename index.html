<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학생 맞춤 건강 식품 추천 및 식단 관리 시스템</title>
    <!-- FontAwesome 아이콘 라이브러리 추가 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --secondary-gradient: linear-gradient(135deg, #3b82f6 0%, #2dd4bf 100%);
            --success-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --danger-gradient: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
            --warning-gradient: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            --glass-bg: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            padding: 2.5rem 1rem;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* 글래스모피즘 메인 컨테이너 */
        .container {
            width: 100%;
            max-width: 950px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            padding: 2.5rem;
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 1.5rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(to right, #818cf8, #c084fc, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-sub);
            font-size: 1rem;
        }

        /* 네온 스타일 탭 */
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--glass-border);
            gap: 0.5rem;
            margin-bottom: 2rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }

        .tab-btn {
            background: transparent;
            border: none;
            padding: 0.8rem 1.2rem;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-sub);
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.3s ease;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .tab-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
        }

        .tab-btn.active {
            color: #ffffff;
            background: var(--primary-gradient);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        /* 탭 콘텐츠 애니메이션 */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: tabFade 0.4s ease-out;
        }

        @keyframes tabFade {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        h2 {
            font-size: 1.4rem;
            margin-bottom: 1rem;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Inputs & Controls */
        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.6rem;
            font-size: 0.95rem;
            color: #e2e8f0;
        }

        input[type="text"], select {
            width: 100%;
            padding: 0.9rem 1.2rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            font-size: 1rem;
            color: #ffffff;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, select:focus {
            border-color: #818cf8;
            box-shadow: 0 0 15px rgba(129, 140, 248, 0.3);
            background: rgba(15, 23, 42, 0.8);
        }

        select option {
            background-color: #0f172a;
            color: #ffffff;
        }

        /* 화려한 그라디언트 버튼 */
        .btn {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 0.9rem 1.6rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* 그리드 및 네온 카드 디자인 */
        .grid-cols-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
        .grid-cols-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2rem; }
        .grid-cols-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.2rem; }

        @media (max-width: 768px) {
            .grid-cols-2, .grid-cols-3, .grid-cols-4 { grid-template-columns: 1fr; }
        }

        .card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.2rem;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .card.success {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15) 0%, rgba(5, 150, 105, 0.05) 100%);
            border-color: rgba(16, 185, 129, 0.4);
        }

        .card.danger {
            background: linear-gradient(135deg, rgba(244, 63, 94, 0.15) 0%, rgba(225, 29, 72, 0.05) 100%);
            border-color: rgba(244, 63, 94, 0.4);
        }

        .card.info {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15) 0%, rgba(139, 92, 246, 0.05) 100%);
            border-color: rgba(99, 102, 241, 0.4);
        }

        .card.warning {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.15) 0%, rgba(217, 119, 6, 0.05) 100%);
            border-color: rgba(245, 158, 11, 0.4);
        }

        .metric-title {
            font-size: 0.85rem;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .metric-value {
            font-size: 1.6rem;
            font-weight: 800;
            color: #ffffff;
            margin-top: 0.4rem;
        }

        /* 라디오 버튼 맞춤 디자인 */
        .radio-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            padding: 0.8rem 1.2rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .radio-label:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .radio-label input[type="radio"] {
            accent-color: #818cf8;
            width: 1.1rem;
            height: 1.1rem;
        }

        .feedback-item {
            padding: 0.8rem 1rem;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
            margin-top: 0.6rem;
            font-size: 0.95rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1><i class="fa-solid fa-graduation-cap"></i> 학생 맞춤 건강 관리 시스템</h1>
        <p class="subtitle">학습 집중력 · 성장 체력 · 체질 영양 통합 케어 플랫폼</p>
    </header>

    <!-- 탭 메뉴 -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tab1', this)"><i class="fa-solid fa-utensils"></i> 영양 조회</button>
        <button class="tab-btn" onclick="switchTab('tab2', this)"><i class="fa-solid fa-bowl-food"></i> 이상적 식단</button>
        <button class="tab-btn" onclick="switchTab('tab3', this)"><i class="fa-solid fa-dna"></i> 체질별 추천</button>
        <button class="tab-btn" onclick="switchTab('tab4', this)"><i class="fa-solid fa-chart-pie"></i> 식단 평가</button>
        <button class="tab-btn" onclick="switchTab('tab5', this)"><i class="fa-solid fa-magnifying-glass-chart"></i> 음식 궁합 검색</button>
    </div>

    <!-- 1. 영양 조회 -->
    <div id="tab1" class="tab-content active">
        <h2><i class="fa-solid fa-apple-whole" style="color: #f43f5e;"></i> 음식 영양 성분 검색</h2>
        <br>
        <div class="form-group">
            <label for="nutrient-search">조회하고 싶은 음식을 입력해보세요:</label>
            <input type="text" id="nutrient-search" placeholder="예: 바나나, 사과, 라면, 닭고기..." oninput="searchNutrient()">
        </div>
        <div id="nutrient-result"></div>
    </div>

    <!-- 2. 이상적 식단 -->
    <div id="tab2" class="tab-content">
        <h2><i class="fa-solid fa-calendar-check" style="color: #3b82f6;"></i> 맞춤형 하루 추천 식단</h2>
        <br>
        <div class="radio-group">
            <label class="radio-label">
                <input type="radio" name="diet-type" value="study" checked onchange="renderIdealDiet()"> 🧠 수험생/학습형 (집중력)
            </label>
            <label class="radio-label">
                <input type="radio" name="diet-type" value="growth" onchange="renderIdealDiet()"> 💪 성장/운동형 (체력)
            </label>
        </div>
        <div id="ideal-diet-result"></div>
    </div>

    <!-- 3. 체질별 추천 -->
    <div id="tab3" class="tab-content">
        <h2><i class="fa-solid fa-heart-pulse" style="color: #ec4899;"></i> 체질별 맞춤 솔루션</h2>
        <br>
        <div class="form-group">
            <label for="body-type-select">당신의 체질을 선택하세요:</label>
            <select id="body-type-select" onchange="renderBodyType()">
                <option value="열성 체질">🔥 열성 체질</option>
                <option value="냉성 체질">❄️ 냉성 체질</option>
                <option value="소화약함 체질">🍃 소화약함 체질</option>
                <option value="부종형 체질">💧 부종형 체질</option>
                <option value="에너지부족형 체질">⚡ 만성피로/에너지부족형</option>
            </select>
        </div>
        <div id="body-type-info" style="margin-bottom: 1.5rem;"></div>
        <button class="btn" onclick="recommendFood()"><i class="fa-solid fa-shuffle"></i> 새로운 추천 음식 뽑기</button>
        <div id="body-type-recs" style="margin-top: 1.5rem;"></div>
    </div>

    <!-- 4. 식단 평가 -->
    <div id="tab4" class="tab-content">
        <h2><i class="fa-solid fa-clipboard-check" style="color: #10b981;"></i> 오늘 먹은 식단 정밀 분석</h2>
        <br>
        <div class="form-group">
            <label for="breakfast">아침 식단</label>
            <input type="text" id="breakfast" placeholder="예: 사과, 우유, 계란">
        </div>
        <div class="form-group">
            <label for="lunch">점심 식단</label>
            <input type="text" id="lunch" placeholder="예: 떡볶이, 튀김, 콜라">
        </div>
        <div class="form-group">
            <label for="dinner">저녁 식단</label>
            <input type="text" id="dinner" placeholder="예: 닭가슴살, 샐러드">
        </div>
        <button class="btn" onclick="evaluateDiet()"><i class="fa-solid fa-calculator"></i> 식단 분석 및 점수 측정</button>
        <div id="diet-result" style="margin-top: 1.5rem;"></div>
    </div>

    <!-- 5. 음식 궁합 -->
    <div id="tab5" class="tab-content">
        <h2><i class="fa-solid fa-handshake" style="color: #f59e0b;"></i> AI 음식 궁합 자유 검색</h2>
        <p class="subtitle" style="margin-bottom: 1.5rem;">궁합이 궁금한 식품을 자유롭게 검색하여 최고/최악의 시너지 식품을 확인하세요.</p>
        <div class="form-group">
            <label for="combo-search">음식명을 입력하세요:</label>
            <input type="text" id="combo-search" placeholder="예: 토마토, 시금치, 우유, 고구마, 계란..." oninput="searchCombo()">
        </div>
        <div id="combo-result"></div>
    </div>
</div>

    };

    // --- 탭 전환 ---
    function switchTab(tabId, element) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        element.classList.add('active');
    }

    // --- 1. 영양 조회 ---
    function searchNutrient() {
        const query = document.getElementById('nutrient-search').value.trim();
        const resultDiv = document.getElementById('nutrient-result');

        if (!query) {
            resultDiv.innerHTML = '';
            return;
        }

        let key = Object.keys(FOOD_DB).find(k => k.includes(query) || query.includes(k));

        if (key) {
            const data = FOOD_DB[key];
            resultDiv.innerHTML = `
                <div class="card success" style="margin-bottom: 1rem;">
                    ✨ <strong>'${key}'</strong> 영양 데이터 검색 완료
                </div>
                <div class="grid-cols-4">
                    <div class="card"><div class="metric-title">🔥 칼로리</div><div class="metric-value">${data.칼로리} <small style="font-size:0.9rem">kcal</small></div></div>
                    <div class="card"><div class="metric-title">🌾 탄수화물</div><div class="metric-value">${data.탄수화물} <small style="font-size:0.9rem">g</small></div></div>
                    <div class="card"><div class="metric-title">🥩 단백질</div><div class="metric-value">${data.단백질} <small style="font-size:0.9rem">g</small></div></div>
                    <div class="card"><div class="metric-title">🥑 지방</div><div class="metric-value">${data.지방} <small style="font-size:0.9rem">g</small></div></div>
                </div>
            `;
        } else {
            resultDiv.innerHTML = `
                <div class="card warning">
                    ⚠️ '${query}'에 대한 정확한 데이터를 찾지 못했습니다.<br>
                    💡 <strong>추천 검색어:</strong> '바나나', '사과', '계란', '토마토', '라면', '닭고기'
                </div>
            `;
        }
    }

    // --- 3. 체질별 추천 ---
    function renderBodyType() {
        const type = document.getElementById('body-type-select').value;
        const data = BODY_TYPES[type];
        const infoDiv = document.getElementById('body-type-info');

        infoDiv.innerHTML = `
            <div class="card info">
                <p style="font-size:1.05rem; margin-bottom:0.4rem;"><strong>💡 체질 특징:</strong> ${data.설명}</p>
                <p style="color:#f43f5e;"><strong>❌ 주의할 식품:</strong> ${data.비추천.join(', ')}</p>
            </div>
        `;
        recommendFood();
    }

    function recommendFood() {
        const type = document.getElementById('body-type-select').value;
        const list = BODY_TYPES[type].추천;
        const shuffled = [...list].sort(() => 0.5 - Math.random());
        const picked = shuffled.slice(0, 2);

        document.getElementById('body-type-recs').innerHTML = `
            <div class="card success">
                <h3 style="color:#34d399; margin-bottom:0.5rem;"><i class="fa-solid fa-circle-check"></i> 오늘 이 체질에 딱 맞는 음식</h3>
                <p style="font-size:1.2rem; font-weight:700;">✨ ${picked[0]}, ${picked[1]}</p>
            </div>
        `;
    }

    // --- 4. 식단 평가 ---
    function evaluateDiet() {
        const b = document.getElementById('breakfast').value;
        const l = document.getElementById('lunch').value;
        const d = document.getElementById('dinner').value;
        const allText = `${b} ${l} ${d}`;

        let score = 100;
        let praise = [];
        let feedback = [];

        if (!b || ['없음', '안먹음', 'x', 'X'].includes(b.trim())) {
            score -= 15;
            feedback.push("⚠️ <strong>아침 공복:</strong> 아침을 거르면 뇌 활성화 에너지가 부족해집니다.");
        } else {
            praise.push("✅ <strong>아침 식사 섭취:</strong> 아침을 챙겨 먹어 두뇌에 영양을 공급했습니다.");
        }

        const proteinKws = ["계란", "달걀", "닭", "고기", "두부", "우유", "생선"];
        if (!proteinKws.some(kw => allText.includes(kw))) {
            score -= 20;
            feedback.push("⚠️ <strong>단백질 부족:</strong> 근육 및 성장 완성을 위해 단백질을 보충하세요.");
        } else {
            praise.push("✅ <strong>단백질 섭취:</strong> 질 좋은 단백질 식품이 포함되어 있습니다.");
        }

        const junkKws = ["라면", "떡볶이", "튀김", "치킨", "피자", "콜라", "과자"];
        let junkCount = 0;
        junkKws.forEach(kw => { if (allText.includes(kw)) junkCount++; });

        if (junkCount >= 2) {
            score -= 25;
            feedback.push("⚠️ <strong>인스턴트 주의:</strong> 자극적인 음식 비율이 높아 피로감이 늘 수 있습니다.");
        }

        score = Math.max(score, 0);

        let html = `
            <div class="card info" style="margin-bottom:1rem; text-align:center;">
                <div class="metric-title">📊 오늘 식단 밸런스 점수</div>
                <div class="metric-value" style="font-size:2.5rem; color:#818cf8;">${score} <small style="font-size:1.2rem">점</small></div>
            </div>
        `;

        if (praise.length > 0) {
            html += `<h4 style="margin-top:1rem; color:#34d399;">🌟 훌륭한 점</h4>`;
            praise.forEach(p => html += `<div class="feedback-item">${p}</div>`);
        }

        if (feedback.length > 0) {
            html += `<h4 style="margin-top:1rem; color:#f43f5e;">🎯 개선 방향</h4>`;
            feedback.forEach(f => html += `<div class="feedback-item">${f}</div>`);
        }

        document.getElementById('diet-result').innerHTML = html;
    }

    // --- 5. 음식 궁합 ---
    function searchCombo() {
        const query = document.getElementById('combo-search').value.trim();
        const resultDiv = document.getElementById('combo-result');

        if (!query) {
            resultDiv.innerHTML = '';
            return;
        }

        let key = Object.keys(FOOD_COMBOS).find(k => k.includes(query) || query.includes(k));

        if (key) {
            const data = FOOD_COMBOS[key];
            resultDiv.innerHTML = `
                <div class="grid-cols-2">
                    <div class="card success">
                        <h3 style="color:#34d399; margin-bottom:0.8rem;"><i class="fa-solid fa-thumbs-up"></i> [${key}] 최고 궁합</h3>

                        <p style="font-size:0.9rem; color:var(--text-sub);">👉 ${data.Bad[1]}</p>

                </div>
            `;
        } else {

                <div class="card warning" style="margin-bottom:1rem;">

                </div>

                    </div>
                    <div class="card danger">
                        <h3 style="color:#f43f5e;">❌ 비추천 조합: 정제당, 탄산음료</h3>
                        <p style="margin-top:0.5rem; font-size:0.9rem; color:var(--text-sub);">설탕이나 가공 음료와 함께 섭취하면 주요 영양소가 결합 손실될 수 있습니다.</p>
                    </div>
                </div>
            `;
        }
    }
